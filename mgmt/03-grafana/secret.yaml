# 실제 값은 이 파일에 커밋하지 말 것. 아래 커맨드로 직접 Secret을 생성 권장:
#   kubectl create secret generic grafana -n monitoring \
#     --from-literal=admin-user=<실제값> \
#     --from-literal=admin-password=<실제값> \
#     --from-literal=ldap-toml=''
apiVersion: v1
kind: Secret
metadata:
  name: grafana
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: "REPLACE_ME"
  ldap-toml: ""
