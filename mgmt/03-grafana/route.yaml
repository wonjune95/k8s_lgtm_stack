apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  hostnames:
  # datasource-provisioning-cm.yaml의 grafana.ini domain/root_url과 반드시 동일한 값
  - REPLACE_ME_GRAFANA_DOMAIN
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: REPLACE_ME_GATEWAY_NAME
    namespace: REPLACE_ME_GATEWAY_NAMESPACE
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: grafana
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
