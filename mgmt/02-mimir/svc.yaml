apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitoring
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 9009
    protocol: TCP
    targetPort: 9009
  selector:
    app.kubernetes.io/name: mimir
  sessionAffinity: None
  type: ClusterIP
