# Mimir의 remote_write 수신 엔드포인트(/api/v1/push)를 dev/prod 클러스터가
# 외부에서 접근할 수 있게 노출. basicauth-middleware.yaml을 filter로 건다.
# (01-loki/route.yaml과 동일 패턴 — Loki는 로그, 이쪽은 메트릭)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir-push-route
  namespace: monitoring
spec:
  hostnames:
  # 내부 DNS에 등록된 mgmt 도메인 (env의 MIMIR_DOMAIN)
  - REPLACE_ME_MIMIR_DOMAIN
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: REPLACE_ME_GATEWAY_NAME
    namespace: REPLACE_ME_GATEWAY_NAMESPACE
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: mimir-push-basicauth
    backendRefs:
    - group: ''
      kind: Service
      name: mimir
      port: 9009
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /api/v1/push
