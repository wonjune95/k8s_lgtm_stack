apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # 노드 메트릭 수집 (CPU, Memory, Disk, Network, Filesystem)
      hostmetrics:
        collection_interval: 15s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          load: {}
          network: {}
          filesystem:
            exclude_mount_points:
              mount_points: ["/dev/*", "/proc/*", "/sys/*", "/run/*", "/var/lib/docker/*"]
              match_type: regexp
          paging: {}
          processes: {}
          process:
            include:
              match_type: ""
              names: []
            mute_process_exe_error: true
            mute_process_io_error: true
            mute_process_user_error: true

      # Kubelet 메트릭 수집 (컨테이너 CPU, Memory, Volume, Network)
      kubeletstats:
        collection_interval: 15s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_HOST_IP}:10250"
        insecure_skip_verify: true
        metric_groups:
          - node
          - pod
          - container

      # Kubernetes 이벤트 수집 (Warning, Normal)
      k8sobjects:
        objects:
          - name: events
            mode: watch
            group: ""
            namespaces: []

      # Prometheus 메트릭 수집 (Annotation 기반)
      prometheus:
        config:
          scrape_configs:
            - job_name: 'kubernetes-pods'
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: true
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
                  action: replace
                  target_label: __scheme__
                  regex: (https?)
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  action: replace
                  target_label: container
                - source_labels: [__meta_kubernetes_pod_node_name]
                  action: replace
                  target_label: node

            - job_name: 'kubernetes-service-endpoints'
              kubernetes_sd_configs:
                - role: endpoints
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
                  action: keep
                  regex: true
                - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
                  action: replace
                  target_label: __scheme__
                  regex: (https?)
                - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: namespace
                - source_labels: [__meta_kubernetes_service_name]
                  action: replace
                  target_label: service
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: pod

      # 컨테이너 로그 파일 수집
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/observability_otel-collector*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          # 컨테이너 로그 형식 파싱 (JSON 또는 정규식 자동 감지)
          - type: container
            id: container-parser
        retry_on_failure:
          enabled: true

    processors:
      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s

      memory_limiter:
        check_interval: 2s
        limit_mib: 400
        spike_limit_mib: 100

      # Kubernetes 메타데이터 자동 추출
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
          labels:
            - tag_name: app
              key: app
              from: pod
            - tag_name: service_name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: component
              key: app.kubernetes.io/component
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      # 리소스 감지 (환경, OS, 호스트 자동 감지)
      resourcedetection:
        detectors: [env, system]
        timeout: 5s
        override: false
        system:
          hostname_sources: ["os"]
          resource_attributes:
            host.name:
              enabled: true
            os.type:
              enabled: false
            host.arch:
              enabled: false

      # 라벨 변환 및 보정 (service_name 필드 강제 생성 및 통일)
      transform:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service_name"], attributes["k8s.container.name"]) where attributes["service_name"] == nil
              - set(attributes["service_name"], attributes["k8s.pod.name"]) where attributes["service_name"] == nil
        metric_statements:
          - context: datapoint
            statements:
              # 메트릭에서도 service_name 라벨 생성
              - set(attributes["service_name"], resource.attributes["k8s.container.name"]) where attributes["service_name"] == nil
        trace_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == "unknown_service" or attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["service.name"] == "unknown_service" or attributes["service.name"] == nil

      # 불필요한 로그 필터링 (헬스체크, readiness, liveness 억제)
      filter/logs:
        error_mode: ignore
        logs:
          log_record:
            - 'IsMatch(body, ".*health.*") and IsMatch(body, ".*GET.*") and IsMatch(body, ".*200.*")'
            - 'IsMatch(body, ".*readyz.*")'
            - 'IsMatch(body, ".*livez.*")'

      resource:
        attributes:
          - action: insert
            key: cluster
            value: "temp-nks"
          - action: insert
            key: job
            value: "kubernetes-logs"
          - action: insert
            key: node
            value: ${env:K8S_NODE_NAME}

      # 속성 추가/변환
      attributes/logs:
        actions:
          - action: insert
            key: loki.attribute.labels
            value: "namespace,pod,container,service_name,node,cluster"

    exporters:
      debug:
        verbosity: basic

      # Loki OTLP 익스포터
      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        tls:
          insecure: true

      prometheusremotewrite:
        endpoint: http://mimir.observability.svc.cluster.local:9009/api/v1/push
        tls:
          insecure: true
        resource_to_telemetry_conversion:
          enabled: true

      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, zpages]
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [k8sattributes, transform, filter/logs, memory_limiter, resource, attributes/logs, batch]
          exporters: [otlphttp/loki, debug]
        logs/k8s_events:
          receivers: [k8sobjects]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [otlp, prometheus, hostmetrics, kubeletstats]
          processors: [k8sattributes, transform, memory_limiter, resourcedetection, resource, batch]
          exporters: [prometheusremotewrite, debug]
        traces:
          receivers: [otlp]
          processors: [k8sattributes, transform, memory_limiter, resource, batch]
          exporters: [otlp/tempo, debug]
