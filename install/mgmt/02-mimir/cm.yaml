# 멀티클러스터라고 해서 Mimir 자체 설정이
# 바뀔 건 없음(수신 메트릭에 cluster 라벨을 붙이는 건 push하는 쪽 책임:
# 각 클러스터의 otel-collector가 external_labels로 cluster=<이름>을
# 붙여서 보낸다. 여기서는 그 라벨을 그대로 저장/조회만 함).
apiVersion: v1
data:
  mimir.yaml: |
    target: all
    multitenancy_enabled: false
    server:
      http_listen_port: 9009
    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/mimir/blocks
      tsdb:
        dir: /data/mimir/tsdb
    compactor:
      data_dir: /data/mimir/compactor
      sharding_ring:
        kvstore:
          store: inmemory
    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
        replication_factor: 1
    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    store_gateway:
      sharding_ring:
        replication_factor: 1
    # 기본값은 무기한 보관 → PVC가 결국 가득 참. 디스크 용량 보고 조정.
    limits:
      compactor_blocks_retention_period: 15d
kind: ConfigMap
metadata:
  name: mimir
  namespace: monitoring
