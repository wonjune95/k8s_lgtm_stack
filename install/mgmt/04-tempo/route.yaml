# dev/prod otel-collector가 트레이스를 push하는 OTLP/HTTP 엔드포인트(/v1/traces) 외부 노출.
# 조회(3200)는 노출하지 않는다 — Grafana가 클러스터 내부 Service로 조회한다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tempo-push-route
  namespace: monitoring
spec:
  hostnames:
  # 내부 DNS에 등록된 mgmt 도메인 (env의 TEMPO_DOMAIN)
  - REPLACE_ME_TEMPO_DOMAIN
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: REPLACE_ME_GATEWAY_NAME
    namespace: REPLACE_ME_GATEWAY_NAMESPACE
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: tempo-push-basicauth
    backendRefs:
    - group: ''
      kind: Service
      name: tempo
      port: 4318
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /v1/traces
