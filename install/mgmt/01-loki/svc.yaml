apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: loki
  name: loki
  namespace: monitoring
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 3100
    protocol: TCP
    targetPort: 3100
  selector:
    app.kubernetes.io/name: loki
  sessionAffinity: None
  type: ClusterIP
