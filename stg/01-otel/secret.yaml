# 이 클러스터 전용 push 인증 토큰 3개 (로그/메트릭/트레이스) — 평문. 루트의 configure.sh가 secrets.env에서 채운다.
# mgmt BasicAuth에는 같은 토큰의 해시가 들어간다 (해시를 여기 넣으면 401).
# 다른 클러스터와 절대 공유하지 말 것 — 하나 유출돼도 그 클러스터만 무효화 가능해야 함.
# 01-otel/daemonset.yaml과 01-otel/cluster.yaml이 이 Secret을 공유해서 쓴다.
apiVersion: v1
kind: Secret
metadata:
  name: mgmt-push-auth
  namespace: monitoring
type: Opaque
stringData:
  LOKI_PUSH_TOKEN: "REPLACE_ME"
  MIMIR_PUSH_TOKEN: "REPLACE_ME"
  TEMPO_PUSH_TOKEN: "REPLACE_ME"
