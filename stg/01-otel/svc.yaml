# 클러스터 내부 전용 ClusterIP. 외부 Route는 이 세트에 포함하지 않음 —
# Envoy가 zipkin(9411)으로, OTel SDK 앱이 OTLP(4317/4318)로 이 Service에 트레이스를 보낸다
# (클러스터 내부 DNS). 로그는 file_log가 노드에서 직접 tail하므로 외부 노출은 필요 없음.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: otel-collector
  name: otel-collector
  namespace: monitoring
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: otlp-grpc
    port: 4317
    protocol: TCP
    targetPort: 4317
  - name: otlp-http
    port: 4318
    protocol: TCP
    targetPort: 4318
  - name: zipkin
    port: 9411
    protocol: TCP
    targetPort: 9411
  selector:
    app.kubernetes.io/name: otel-collector
  sessionAffinity: None
  type: ClusterIP
